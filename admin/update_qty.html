
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inventory Item Action | PTC</title>
<style>
*{box-sizing:border-box;font-family:Arial,sans-serif}
body{margin:0;min-height:100vh;padding:24px;background:linear-gradient(135deg,#07111f,#0f172a,#001f2f);color:#fff;display:grid;place-items:center}
.card{width:100%;max-width:520px;padding:30px;border-radius:26px;background:#ffffff12;border:1px solid #ffffff18;box-shadow:0 15px 45px #0005}
h1{font-size:27px;margin-top:0}
p{line-height:1.6;color:#d5e0e8;overflow-wrap:anywhere}
label{display:block;margin:18px 0 8px;font-weight:bold}
input,select{width:100%;padding:13px;border:1px solid #ffffff30;border-radius:12px;background:#101e30;color:#fff;font-size:16px}
button,.back{display:inline-block;width:100%;padding:14px;margin-top:18px;border:0;border-radius:13px;background:linear-gradient(135deg,#00b894,#00cec9);color:#07111f;font-size:16px;font-weight:bold;text-decoration:none;text-align:center;cursor:pointer}
button:disabled{opacity:.55;cursor:not-allowed}
.back{background:#ffffff16;color:white}
.notice{display:none;margin-top:16px;padding:13px;border-radius:12px;line-height:1.5;overflow-wrap:anywhere}
.notice.show{display:block}
.notice.error{background:#ffe2e2;color:#8a1e1e}
.notice.success{background:#d9ffe9;color:#14532d}
.notice.info{background:#dff4ff;color:#174778}
</style>
</head>
<body>
<main class="card">
  <h1>📦 Inventory Item Action</h1>
  <p id="itemInfo">Checking item and account…</p>

  <form id="actionForm">
    <label for="actionType">Action</label>
    <select id="actionType" required>
      <option value="minus">Borrow item</option>
      <option value="plus">Return item</option>
    </select>

    <label for="quantity">Quantity</label>
    <input id="quantity" type="number" min="1" step="1" value="1" required>

    <div id="returnHelp" hidden>
      <p>For returns, select an active borrow record belonging to your account.</p>
      <label for="borrowLog">Active borrow record</label>
      <select id="borrowLog">
        <option value="">Loading active records…</option>
      </select>
    </div>

    <button id="submitBtn" type="submit" disabled>Loading…</button>
  </form>

  <div id="notice" class="notice" role="status" aria-live="polite"></div>
  <a class="back" href="dashboard.html">← Back to Dashboard</a>
</main>

<script type="module">
import { auth, db } from "./firebase.js";

import {
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";

import {
  collection, doc, getDoc, getDocs, query, where,
  runTransaction, serverTimestamp, limit
} from "https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js";

const $ = id => document.getElementById(id);
const params = new URLSearchParams(location.search);

// Existing app uses Firestore item document IDs.
// Accept id= for compatibility with the PHP URL, and item_id= as an alternative.
const itemId = params.get("id") || params.get("item_id");
const requestedType = params.get("type");
const initialAction = requestedType === "minus" ? "minus" :
                      requestedType === "plus" ? "plus" : null;

let currentUser = null;
let itemData = null;
let userProfile = null;
let activeLogs = [];
let busy = false;

function notify(message, type = "info") {
  $("notice").textContent = message;
  $("notice").className = "notice show " + type;
}

function showActionUI() {
  const returning = $("actionType").value === "plus";
  $("returnHelp").hidden = !returning;
  $("borrowLog").required = returning;
  $("submitBtn").textContent = returning ? "Confirm Return" : "Confirm Borrow";
}

async function loadItem() {
  if (!itemId) {
    throw new Error("Missing item ID. Open this page with ?id=FIRESTORE_ITEM_DOCUMENT_ID&type=minus or type=plus.");
  }

  const snap = await getDoc(doc(db, "items", itemId));

  if (!snap.exists()) {
    throw new Error("Hindi makita ang item sa items collection.");
  }

  itemData = snap.data();

  $("itemInfo").textContent =
    "Item: " + (itemData.item_name || itemData.itemName || itemData.name || itemId) +
    " | Available stock: " + (itemData.quantity ?? 0);

  if (initialAction) {
    $("actionType").value = initialAction;
  }

  showActionUI();
}

async function loadActiveBorrowLogs() {
  const logsQuery = query(
    collection(db, "borrow_logs"),
    where("user_id", "==", currentUser.uid),
    where("item_id", "==", itemId),
    where("status", "==", "borrowed"),
    limit(100)
  );

  const snap = await getDocs(logsQuery);
  activeLogs = snap.docs.map(d => ({ id: d.id, ...d.data() }));

  const select = $("borrowLog");
  select.replaceChildren();

  if (!activeLogs.length) {
    const option = document.createElement("option");
    option.value = "";
    option.textContent = "No active borrow records for this item";
    select.appendChild(option);
    return;
  }

  activeLogs.forEach(log => {
    const option = document.createElement("option");
    option.value = log.id;
    option.textContent =
      "Record " + log.id + " — Quantity: " + (log.quantity ?? 1);
    select.appendChild(option);
  });
}

async function executeBorrow(quantity) {
  const itemRef = doc(db, "items", itemId);
  const userRef = doc(db, "users", currentUser.uid);
  const logRef = doc(collection(db, "borrow_logs"));

  await runTransaction(db, async tx => {
    const [itemSnap, userSnap] = await Promise.all([
      tx.get(itemRef),
      tx.get(userRef)
    ]);

    if (!itemSnap.exists() || !userSnap.exists()) {
      throw new Error("Missing item or user profile.");
    }

    const item = itemSnap.data();
    const profile = userSnap.data();
    const stock = Number(item.quantity ?? 0);
    const limitValue = Number(profile.borrow_limit ?? 2);
    const borrowed = Number(profile.current_borrowed ?? 0);

    if (!Number.isInteger(quantity) || quantity < 1) {
      throw new Error("Invalid quantity.");
    }

    if (stock < quantity) {
      throw new Error("Insufficient available stock.");
    }

    if (borrowed + quantity > limitValue) {
      throw new Error("Borrow limit exceeded.");
    }

    tx.update(itemRef, { quantity: stock - quantity });

    tx.update(userRef, {
      current_borrowed: borrowed + quantity
    });

    tx.set(logRef, {
      user_id: currentUser.uid,
      item_id: itemId,
      item_name: item.item_name || item.itemName || item.name || "Item",
      username: profile.username || currentUser.displayName || "",
      institutional_email: profile.institutional_email || currentUser.email || "",
      quantity,
      type: "borrow",
      status: "borrowed",
      date_borrowed: serverTimestamp(),
      created_at: serverTimestamp()
    });
  });
}

async function executeReturn(quantity, logId) {
  const itemRef = doc(db, "items", itemId);
  const userRef = doc(db, "users", currentUser.uid);
  const logRef = doc(db, "borrow_logs", logId);
  const returnRef = doc(collection(db, "return_logs"));

  await runTransaction(db, async tx => {
    const [itemSnap, userSnap, logSnap] = await Promise.all([
      tx.get(itemRef),
      tx.get(userRef),
      tx.get(logRef)
    ]);

    if (!itemSnap.exists() || !userSnap.exists() || !logSnap.exists()) {
      throw new Error("Missing item, user, or borrow record.");
    }

    const item = itemSnap.data();
    const profile = userSnap.data();
    const log = logSnap.data();

    if (log.user_id !== currentUser.uid || log.item_id !== itemId) {
      throw new Error("This borrow record does not belong to your account or this item.");
    }

    if (log.status !== "borrowed") {
      throw new Error("This borrow record is not currently active.");
    }

    const borrowedQuantity = Number(log.quantity ?? 1);

    if (!Number.isInteger(quantity) || quantity < 1 || quantity !== borrowedQuantity) {
      throw new Error("Return quantity must match the quantity in the selected borrow record.");
    }

    const stock = Number(item.quantity ?? 0);
    const currentBorrowed = Number(profile.current_borrowed ?? 0);

    tx.update(itemRef, {
      quantity: stock + quantity
    });

    tx.update(userRef, {
      current_borrowed: Math.max(0, currentBorrowed - quantity)
    });

    tx.update(logRef, {
      status: "returned",
      type: "return",
      date_returned: serverTimestamp()
    });

    tx.set(returnRef, {
      borrow_log_id: logId,
      user_id: currentUser.uid,
      item_id: itemId,
      quantity,
      type: "return",
      status: "returned",
      return_date: serverTimestamp()
    });
  });
}

$("actionType").addEventListener("change", async () => {
  showActionUI();

  if ($("actionType").value === "plus" && currentUser) {
    try {
      await loadActiveBorrowLogs();
    } catch (error) {
      notify("Unable to load active borrow records: " + error.message, "error");
    }
  }
});

$("borrowLog").addEventListener("change", () => {
  const log = activeLogs.find(item => item.id === $("borrowLog").value);
  if (log) $("quantity").value = String(log.quantity ?? 1);
});

$("actionForm").addEventListener("submit", async event => {
  event.preventDefault();
  if (busy || !currentUser) return;

  const quantity = Number($("quantity").value);
  const action = $("actionType").value;

  if (!Number.isInteger(quantity) || quantity < 1) {
    notify("Enter a valid whole-number quantity.", "error");
    return;
  }

  busy = true;
  $("submitBtn").disabled = true;

  try {
    if (action === "minus") {
      await executeBorrow(quantity);
      notify("Borrow recorded successfully.", "success");
    } else {
      const logId = $("borrowLog").value;
      if (!logId) throw new Error("Select an active borrow record first.");

      await executeReturn(quantity, logId);
      notify("Return recorded successfully.", "success");
    }

    $("submitBtn").textContent = "Redirecting…";
    setTimeout(() => {
      location.href = "dashboard.html";
    }, 1000);
  } catch (error) {
    console.error(error);
    notify(error.message || "Action failed.", "error");
    busy = false;
    $("submitBtn").disabled = false;
    showActionUI();
  }
});

onAuthStateChanged(auth, async user => {
  if (!user) {
    location.replace("../login.html");
    return;
  }

  currentUser = user;

  try {
    const profileSnap = await getDoc(doc(db, "users", user.uid));

    if (!profileSnap.exists()) {
      throw new Error("User profile not found.");
    }

    userProfile = profileSnap.data();

    if (String(userProfile.role || "").toLowerCase() === "admin") {
      throw new Error("This page is for authenticated borrowers, not admin inventory adjustments.");
    }

    await loadItem();

    if ($("actionType").value === "plus") {
      await loadActiveBorrowLogs();
    }

    $("submitBtn").disabled = false;
    showActionUI();
  } catch (error) {
    notify(error.message || "Unable to initialize item action.", "error");
    $("submitBtn").disabled = true;
  }
});
</script>
</body>
</html>
