
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Loading System | PTC Inventory</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      background: #0f172a;
      color: white;
      padding: 20px;
    }

    .glow {
      position: fixed;
      width: 300px;
      height: 300px;
      background: #00cec9;
      border-radius: 50%;
      filter: blur(120px);
      opacity: .2;
      animation: pulse 3s infinite;
      pointer-events: none;
    }

    .logo {
      font-size: 76px;
      margin-bottom: 20px;
      animation: pop 1s ease;
    }

    .title {
      font-size: clamp(23px, 5vw, 38px);
      font-weight: bold;
      margin-bottom: 12px;
      letter-spacing: 2px;
      text-align: center;
      animation: fadeUp 1s ease;
    }

    .subtitle {
      color: #ccc;
      margin-bottom: 40px;
      text-align: center;
      animation: fadeUp 1.5s ease;
    }

    .loader {
      width: min(320px, 85vw);
      height: 12px;
      background: #1e293b;
      border-radius: 20px;
      overflow: hidden;
    }

    .loader-bar {
      height: 100%;
      width: 0;
      background: linear-gradient(90deg, #00b894, #00cec9);
      border-radius: 20px;
      animation: loading 4s linear forwards;
    }

    .loading-text {
      margin-top: 20px;
      color: #aaa;
      font-size: 14px;
    }

    .error {
      max-width: 420px;
      margin-top: 22px;
      color: #fecaca;
      text-align: center;
      line-height: 1.5;
    }

    .error a {
      color: #67e8f9;
    }

    @keyframes loading {
      to { width: 100%; }
    }

    @keyframes pop {
      from { transform: scale(0); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    @keyframes fadeUp {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    @keyframes pulse {
      50% { transform: scale(1.1); }
    }
  </style>
</head>

<body>
  <div class="glow"></div>
  <div class="logo">📚</div>
  <div class="title">PTC INVENTORY SYSTEM</div>
  <div class="subtitle" id="welcome">Verifying your account...</div>

  <div class="loader">
    <div class="loader-bar"></div>
  </div>

  <div class="loading-text" id="status">
    Initializing system...
  </div>

  <div class="error" id="error" hidden></div>

  <script type="module">
    import { initializeApp } from
      "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";

    import {
      getAuth,
      onAuthStateChanged,
      signOut
    } from
      "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";

    import {
      getFirestore,
      doc,
      getDoc
    } from
      "https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCik-MVlxK6cshGy87dXOi10a0_c52cO1w",
      authDomain: "inventory-4f2b5.firebaseapp.com",
      projectId: "inventory-4f2b5",
      storageBucket: "inventory-4f2b5.firebasestorage.app",
      messagingSenderId: "185805306294",
      appId: "1:185805306294:web:d674bd3c32b9994fa46917",
      measurementId: "G-5KCN8KL8ET"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const welcome = document.getElementById("welcome");
    const status = document.getElementById("status");
    const errorBox = document.getElementById("error");

    let handled = false;

    function showError(message) {
      errorBox.hidden = false;
      errorBox.textContent = message;
      status.textContent = "Unable to initialize system.";
    }

    onAuthStateChanged(auth, async (user) => {
      if (handled) return;

      if (!user) {
        location.replace("login.html");
        return;
      }

      handled = true;
      status.textContent = "Loading your profile...";

      try {
        const profileRef = doc(db, "users", user.uid);
        const profileSnap = await getDoc(profileRef);

        if (!profileSnap.exists()) {
          handled = false;
          showError(
            "Your Firebase account exists, but its users/" +
            user.uid +
            " profile is missing. Ask an administrator to configure it."
          );
          return;
        }

        const profile = profileSnap.data();
        const role = String(profile.role || "")
          .trim()
          .toLowerCase();

        const name = profile.name || user.displayName || user.email || "User";

        welcome.textContent = "Welcome, " + name;
        status.textContent = "Preparing your dashboard...";

        let destination;

        if (role === "admin" || role === "administrator") {
          destination = "menu.html";
        } else if (role === "faculty") {
          destination = "faculty_dashboard.html";
        } else if (role === "student") {
          destination = "student_dashboard.html";
        } else {
          showError(
            "Your profile has an unrecognized role. Contact your administrator."
          );
          return;
        }

        setTimeout(() => {
          location.replace(destination);
        }, 4000);

      } catch (error) {
        handled = false;
        console.error("Profile loading error:", error);

        if (error.code === "permission-denied") {
          showError(
            "Firestore denied access to your profile. Check your Firestore Rules."
          );
        } else {
          showError(
            "Unable to load your profile. Check your internet connection and Firebase configuration."
          );
        }
      }
    });
  </script>
</body>
</html>
