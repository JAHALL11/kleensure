
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Logging Out | PTC Inventory</title>

  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
      color: white;
      background: linear-gradient(135deg, #07111f, #0f172a, #001f2f);
    }

    .card {
      width: 100%;
      max-width: 420px;
      padding: 38px 28px;
      text-align: center;
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 15px 50px rgba(0, 0, 0, 0.35);
    }

    .icon {
      font-size: 52px;
      margin-bottom: 16px;
    }

    h1 {
      font-size: 27px;
      margin: 0 0 12px;
    }

    p {
      color: #cbd5e1;
      line-height: 1.7;
    }

    .loader {
      width: 38px;
      height: 38px;
      margin: 24px auto 0;
      border: 4px solid rgba(255, 255, 255, 0.2);
      border-top-color: #55efc4;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    a {
      display: inline-block;
      margin-top: 18px;
      padding: 13px 20px;
      border-radius: 14px;
      color: #07111f;
      background: linear-gradient(135deg, #00b894, #55efc4);
      text-decoration: none;
      font-weight: bold;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      .loader { animation: none; }
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="icon">🔐</div>
    <h1 id="heading">Logging Out...</h1>
    <p id="message">Please wait while we securely sign you out.</p>
    <div class="loader" id="loader"></div>
    <a id="loginLink" href="login.html" hidden>Return to Login</a>
  </main>

  <script type="module">
    import { auth } from "./firebase.js";
    import { signOut } from
      "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";

    // Replace the current history entry so Back does not return here.
    history.replaceState(null, "", location.href);

    async function logout() {
      try {
        await signOut(auth);

        document.getElementById("heading").textContent = "Logged Out";
        document.getElementById("message").textContent =
          "You have been signed out successfully. Redirecting to login...";
        document.getElementById("loader").hidden = true;

        // Replace logout page in browser history.
        window.location.replace("login.html");

      } catch (error) {
        console.error("Logout error:", error);

        document.getElementById("heading").textContent = "Logout Issue";
        document.getElementById("message").textContent =
          "We couldn't confirm sign-out. Please try again or return to the login page.";
        document.getElementById("loader").hidden = true;

        const loginLink = document.getElementById("loginLink");
        loginLink.hidden = false;
      }
    }

    // Prevent a cached copy from remaining visible on a later visit.
    window.addEventListener("pageshow", (event) => {
      if (event.persisted) {
        window.location.replace("login.html");
      }
    });

    logout();
  </script>
</body>
</html>
