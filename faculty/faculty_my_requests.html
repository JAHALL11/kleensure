
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Faculty My Requests | PTC Inventory</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:linear-gradient(135deg,#07111f,#0f172a,#001f2f);min-height:100vh;padding:30px;color:white}
.top{max-width:1300px;margin:auto;margin-bottom:20px}
.top a{display:inline-block;padding:14px 22px;border-radius:16px;text-decoration:none;font-weight:bold;background:#ffffff14;color:white;transition:.3s}
.top a:hover{background:#6c5ce7}
.card{max-width:1300px;margin:auto;background:#ffffff14;backdrop-filter:blur(15px);padding:35px;border-radius:30px;box-shadow:0 10px 40px #0005}
.title{font-size:clamp(28px,4vw,45px);font-weight:bold;margin-bottom:30px}
.table-wrapper{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:650px}
th{background:#6c5ce7;padding:18px;text-align:left;white-space:nowrap}
td{padding:18px;border-bottom:1px solid #ffffff14;vertical-align:middle}
tbody tr:hover{background:#ffffff0d}
.pending{color:#fdcb6e;font-weight:bold}
.approved{color:#00ff88;font-weight:bold}
.rejected{color:#ff7675;font-weight:bold}
.proof{width:80px;height:80px;object-fit:cover;border-radius:15px;border:2px solid #ffffff14}
.empty{padding:40px;text-align:center;font-size:20px;color:#ccc}
.message{padding:15px;margin-bottom:20px;border-radius:12px;background:#075985;line-height:1.5;overflow-wrap:anywhere}
.footer{text-align:center;margin-top:30px;color:#aaa;font-size:13px}
@media(max-width:700px){body{padding:14px}.card{padding:20px 15px}.title{margin-bottom:20px}td,th{padding:13px}}
</style>
</head>

<body>

<div class="top">
  <a href="faculty_request.html">← Back to Faculty Center</a>
</div>

<div class="card">
  <div class="title">📨 Faculty My Requests</div>

  <div id="message" class="message">Loading your requests...</div>

  <div class="table-wrapper">
    <table>
      <thead>
        <tr>
          <th>Item</th>
          <th>Quantity</th>
          <th>Status</th>
          <th>Request Date</th>
          <th>Proof</th>
        </tr>
      </thead>
      <tbody id="requestsBody"></tbody>
    </table>
  </div>

  <div class="footer">PTC Institutional Inventory System © 2026</div>
</div>

<script type="module">
import {auth,db} from "./firebase.js";

import {
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";

import {
  collection,doc,getDoc,getDocs,query,where
} from "https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js";

const $=id=>document.getElementById(id);

function escapeHTML(value){
  return String(value??"").replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  })[c]);
}

function showMessage(text){
  $("message").textContent=text;
  $("message").style.display="block";
}

function hideMessage(){
  $("message").style.display="none";
}

function formatDate(value){
  if(!value)return "—";

  let date;
  if(typeof value.toDate==="function"){
    date=value.toDate();
  }else if(typeof value==="number"){
    date=new Date(value);
  }else{
    date=new Date(value);
  }

  return Number.isNaN(date.getTime())?"—":date.toLocaleString();
}

function proofCell(url){
  if(!url)return "No Proof";

  const safeURL=escapeHTML(url);

  return `<a href="${safeURL}" target="_blank" rel="noopener noreferrer">
    <img class="proof" src="${safeURL}" alt="Borrow proof"
      loading="lazy"
      onerror="this.style.display='none';this.parentElement.textContent='Image unavailable';">
  </a>`;
}

function statusCell(status){
  const normalized=String(status||"pending").toLowerCase();

  const allowed=["pending","approved","rejected"];
  if(!allowed.includes(normalized)){
    return escapeHTML(status||"Unknown");
  }

  return `<span class="${normalized}">${escapeHTML(
    normalized.charAt(0).toUpperCase()+normalized.slice(1)
  )}</span>`;
}

async function loadRequests(user){
  const profileSnap=await getDoc(doc(db,"users",user.uid));

  if(!profileSnap.exists()){
    throw new Error("Hindi makita ang user profile sa Firestore.");
  }

  const profile=profileSnap.data();

  if(String(profile.role||"").toLowerCase()!=="faculty"){
    throw new Error("Faculty account lamang ang maaaring tumingin sa page na ito.");
  }

  // Assumes requests.user_id stores the Firebase Authentication UID.
  const requestQuery=query(
    collection(db,"requests"),
    where("user_id","==",user.uid)
  );

  const requestSnapshot=await getDocs(requestQuery);

  // Resolve item names using the linked Firestore item document IDs.
  const itemIds=[
    ...new Set(
      requestSnapshot.docs
        .map(s=>{
          const data=s.data();
          return data.item_id==null?null:String(data.item_id);
        })
        .filter(Boolean)
    )
  ];

  const itemResults=await Promise.all(
    itemIds.map(async id=>{
      try{
        const itemSnap=await getDoc(doc(db,"items",id));
        return [id,itemSnap.exists()?itemSnap.data():null];
      }catch(error){
        console.warn("Unable to load item:",id,error);
        return [id,null];
      }
    })
  );

  const itemMap=new Map(itemResults);

  const requests=requestSnapshot.docs.map(s=>{
    const data=s.data();
    const item=itemMap.get(String(data.item_id))||{};

    return {
      id:s.id,
      ...data,
      item_name:data.item_name||item.item_name||item.name||"Deleted Item"
    };
  });

  requests.sort((a,b)=>{
    const getTime=value=>{
      if(!value)return 0;
      if(typeof value.toDate==="function")return value.toDate().getTime();
      const d=new Date(value);
      return Number.isNaN(d.getTime())?0:d.getTime();
    };

    return getTime(b.request_date)-getTime(a.request_date);
  });

  if(requests.length===0){
    $("requestsBody").innerHTML=
      '<tr><td colspan="5" class="empty">📭 No requests found.</td></tr>';
  }else{
    $("requestsBody").innerHTML=requests.map(request=>`
      <tr>
        <td>📦 ${escapeHTML(request.item_name)}</td>
        <td>${escapeHTML(request.quantity??"—")}</td>
        <td>${statusCell(request.status)}</td>
        <td>${escapeHTML(formatDate(request.request_date))}</td>
        <td>${proofCell(request.proof_borrow)}</td>
      </tr>
    `).join("");
  }

  hideMessage();
}

onAuthStateChanged(auth,async user=>{
  if(!user){
    location.href="login.html";
    return;
  }

  try{
    await loadRequests(user);
  }catch(error){
    console.error("Faculty requests error:",error);
    showMessage(error.message||"Hindi ma-load ang requests. Suriin ang Firebase configuration at Firestore rules.");
  }
});
</script>

</body>
</html>
