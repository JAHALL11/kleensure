
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Faculty Request Center | PTC Inventory</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:linear-gradient(135deg,#0b1320,#0f172a,#001f2f);min-height:100vh;padding:30px;color:white;overflow-x:hidden}
.nav-top{max-width:1300px;margin:auto;margin-bottom:20px}
.nav-top a{display:inline-block;padding:14px 22px;border-radius:16px;text-decoration:none;font-weight:bold;background:#ffffff14;backdrop-filter:blur(10px);color:white;border:1px solid #ffffff14;transition:.3s}
.nav-top a:hover{background:#6c5ce7;transform:translateY(-2px)}
.wrapper{max-width:1300px;margin:auto}
.top{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(230px,100%),1fr));gap:20px;margin-bottom:30px}
.stat{padding:28px;border-radius:26px;background:#ffffff14;backdrop-filter:blur(15px);border:1px solid #ffffff14;box-shadow:0 10px 35px #0004;transition:.3s}
.stat:hover{transform:translateY(-4px);background:#ffffff1f}
.stat h3{font-size:15px;margin-bottom:12px;color:#81ecec}
.stat p{font-size:42px;font-weight:bold;overflow-wrap:anywhere}
.card{background:#ffffff14;backdrop-filter:blur(15px);border:1px solid #ffffff14;border-radius:35px;padding:40px;box-shadow:0 10px 40px #0005}
.title{font-size:clamp(28px,4vw,45px);font-weight:bold;margin-bottom:30px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(250px,100%),1fr));gap:22px}
.nav-btn{padding:30px;border-radius:26px;text-decoration:none;font-weight:bold;font-size:20px;color:white;display:flex;align-items:center;justify-content:center;text-align:center;min-height:130px;transition:.3s;box-shadow:0 10px 30px #0004}
.nav-btn:hover{transform:translateY(-5px) scale(1.02);opacity:.95}
.req{background:linear-gradient(135deg,#6c5ce7,#00cec9)}
.recent{background:linear-gradient(135deg,#00b894,#55efc4);color:#062b22}
.logs{background:linear-gradient(135deg,#fdcb6e,#e17055)}
.approval{background:linear-gradient(135deg,#ff4757,#ff6b81)}
.borrow{background:linear-gradient(135deg,#0984e3,#74b9ff)}
.return{background:linear-gradient(135deg,#a29bfe,#6c5ce7)}
.repair{background:linear-gradient(135deg,#ff9f43,#feca57);color:#251700}
.footer{margin-top:30px;text-align:center;color:#aaa;font-size:13px}
.message{max-width:1300px;margin:0 auto 20px;padding:15px;background:#7f1d1d;border-radius:12px;line-height:1.5;overflow-wrap:anywhere}
@media(max-width:600px){body{padding:14px}.card{padding:23px 16px;border-radius:25px}.stat{padding:22px}.stat p{font-size:36px}.nav-btn{min-height:105px;padding:22px;font-size:18px;border-radius:22px}.nav-top a{padding:12px 16px}}
</style>
</head>

<body>

<div class="nav-top">
  <a href="faculty_dashboard.html">← Back to Faculty Dashboard</a>
</div>

<div id="message" class="message" style="display:none"></div>

<div class="wrapper">

  <section class="top">
    <div class="stat">
      <h3>📦 Current Borrowed</h3>
      <p id="currentBorrowed">—</p>
    </div>
    <div class="stat">
      <h3>📚 Borrow Limit</h3>
      <p id="borrowLimit">—</p>
    </div>
    <div class="stat">
      <h3>📨 Total Requests</h3>
      <p id="totalRequests">—</p>
    </div>
    <div class="stat">
      <h3>⏳ Pending</h3>
      <p id="pendingRequests">—</p>
    </div>
  </section>

  <section class="card">
    <div class="title">🚀 Faculty Request Center</div>

    <div class="grid">
      <a href="faculty_borrow_item.html" class="nav-btn borrow">📦 Borrow Item</a>
      <a href="faculty_my_requests.html" class="nav-btn req">📨 My Requests</a>
      <a href="faculty_recent_requests.html" class="nav-btn recent">📜 Recent Requests</a>
      <a href="faculty_borrow_logs.html" class="nav-btn logs">📋 Borrow Logs</a>
      <a href="faculty_requests.html" class="nav-btn approval">🛡 Approval Center</a>
      <a href="faculty_return_item.html" class="nav-btn return">↩ Return Item</a>
      <a href="faculty_borrow_logs.html" class="nav-btn repair">🔧 Repair Center</a>
    </div>
  </section>

  <div class="footer">PTC Institutional Inventory System © 2026</div>
</div>

<script type="module">
import {auth,db} from "./firebase.js";

import {
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";

import {
  doc,getDoc,collection,getDocs,query,where
} from "https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js";

const $=id=>document.getElementById(id);

function showError(text){
  $("message").textContent=text;
  $("message").style.display="block";
}

async function getUserRequests(uid){
  const q=query(
    collection(db,"requests"),
    where("user_id","==",uid)
  );
  return await getDocs(q);
}

onAuthStateChanged(auth,async user=>{
  if(!user){
    location.href="login.html";
    return;
  }

  try{
    const userSnap=await getDoc(doc(db,"users",user.uid));

    if(!userSnap.exists()){
      throw new Error("Hindi makita ang user profile sa Firestore.");
    }

    const profile=userSnap.data();

    if(String(profile.role||"").toLowerCase()!=="faculty"){
      location.href="login.html";
      return;
    }

    const current=Number(profile.current_borrowed??0);
    const limit=Number(profile.borrow_limit??5);

    $("currentBorrowed").textContent=Number.isFinite(current)?current:0;
    $("borrowLimit").textContent=Number.isFinite(limit)?limit:5;

    const requests=await getUserRequests(user.uid);
    const allRequests=requests.docs.map(d=>d.data());

    $("totalRequests").textContent=allRequests.length;
    $("pendingRequests").textContent=
      allRequests.filter(r=>String(r.status||"").toLowerCase()==="pending").length;

  }catch(error){
    console.error("Faculty request center error:",error);
    showError(error.message||"Hindi ma-load ang request center. Tingnan ang Firestore rules at connection.");
  }
});
</script>

</body>
</html>
