<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pending Requests Count</title>
<style>
:root{color-scheme:dark;--mint:#00b894;--cyan:#00cec9}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:18px;background:#0f172a;color:#fff;font-family:Arial,sans-serif}
.counter{width:min(100%,340px);padding:24px;border:1px solid #ffffff22;border-radius:22px;background:linear-gradient(145deg,#ffffff13,#ffffff06);box-shadow:0 16px 38px #0004;text-align:center}
.label{font-size:14px;color:#cbd5e1;font-weight:700;letter-spacing:.4px}
.count{font-size:clamp(42px,12vw,64px);font-weight:800;margin:14px 0;background:linear-gradient(135deg,#55efc4,#00cec9);-webkit-background-clip:text;background-clip:text;color:transparent}
.status{font-size:12px;color:#94a3b8;min-height:16px}
</style>
</head>
<body>
<div class="counter" aria-live="polite">
  <div class="label">⏳ PENDING REQUESTS</div>
  <div class="count" id="pendingCount">—</div>
  <div class="status" id="status">Connecting to Firebase…</div>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "AIzaSyCik-MVlxK6cshGy87dXOi10a0_c52cO1w",
  authDomain: "inventory-4f2b5.firebaseapp.com",
  projectId: "inventory-4f2b5",
  storageBucket: "inventory-4f2b5.firebasestorage.app",
  messagingSenderId: "185805306294",
  appId: "1:185805306294:web:d674bd3c32b9994fa46917",
  measurementId: "G-5KCN8KL8ET"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
async function updatePendingCount(){
  const countEl = document.getElementById("pendingCount");
  const statusEl = document.getElementById("status");
  try {
    const pendingQuery = query(collection(db, "requests"), where("status", "==", "pending"));
    const snapshot = await getDocs(pendingQuery);
    countEl.textContent = snapshot.size;
    statusEl.textContent = "Updated " + new Date().toLocaleTimeString();
  } catch (error) {
    console.error("Failed to load pending requests count:", error);
    countEl.textContent = "—";
    statusEl.textContent = "Unable to load count. Check Firestore Rules.";
  }
}
updatePendingCount();
// Refresh the count periodically; Firestore Rules must permit reading requests.
setInterval(updatePendingCount, 30000);
</script>
</body>
</html>
